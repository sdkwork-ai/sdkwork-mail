# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mail/webserver.pid;
error_log /var/log/sdkwork/mail/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name mail-demo.sdkwork.com mail-demo.birdcoder.com mail-demo.dtupay.com mail-demo.noaper.com mail-demo.sdkwork.cn mail-demo.birdcoder.cn mail-demo.dtupay.cn mail-demo.noaper.cn mail-demo.skubc.com mail-demo.skubc.cn mail-demo.zowalk.com mail-demo.zowalk.cn mail-demo.offer86.com mail-demo.offer86.cn mail-demo.86offer.com mail-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
