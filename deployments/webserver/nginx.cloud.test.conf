# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mail/webserver.pid;
error_log /var/log/sdkwork/mail/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name mail-test.sdkwork.com mail-test.birdcoder.com mail-test.dtupay.com mail-test.sdkwork.cn mail-test.birdcoder.cn mail-test.dtupay.cn mail-test.skubc.com mail-test.skubc.cn mail-test.zowalk.com mail-test.zowalk.cn mail-test.offer86.com mail-test.offer86.cn mail-test.86offer.com mail-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
