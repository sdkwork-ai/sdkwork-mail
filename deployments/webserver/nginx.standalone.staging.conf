# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mail/webserver.pid;
error_log /var/log/sdkwork/mail/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name mail-staging.sdkwork.com mail-staging.birdcoder.com mail-staging.dtupay.com mail-staging.sdkwork.cn mail-staging.birdcoder.cn mail-staging.dtupay.cn mail-staging.skubc.com mail-staging.skubc.cn mail-staging.zowalk.com mail-staging.zowalk.cn mail-staging.offer86.com mail-staging.offer86.cn mail-staging.86offer.com mail-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
